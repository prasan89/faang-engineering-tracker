---
applications:
  - name: faang-engineering-tracker-ui
    memory: 768M
    disk_quota: 1G
    random-route: true
    stack: cflinuxfs5
    buildpacks:
      - nodejs_buildpack
    command: npm run build && npm run start -- -p $PORT
    env:
      NODE_ENV: production
      BACKEND_URL: https://faang-engineering-tracker-api-insightful-bongo-go.cfapps.us10-001.hana.ondemand.com
